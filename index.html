<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f4ed"><title>今天的任務冒險</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap');
:root{--ink:#202b29;--muted:#78817a;--paper:#f6f4ed;--white:#fffefa;--green:#b6d4a5;--deep:#355b48;--line:#e7e5dc;--orange:#ef9b69;--lav:#dcd8f4}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',sans-serif;min-height:100vh}.shell{max-width:1100px;margin:auto;padding:28px 28px 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:45px}.brand{font-size:14px;font-weight:800;letter-spacing:.08em}.brand span{display:inline-grid;place-items:center;background:var(--green);width:30px;height:30px;border-radius:50%;margin-right:9px}.date{font:12px 'DM Mono',monospace;color:var(--muted)}.hero{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:30px}.eyebrow{font:11px 'DM Mono',monospace;letter-spacing:.17em;color:var(--deep);text-transform:uppercase}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.2;letter-spacing:-.06em;margin:12px 0}.hero h1 em{font-style:normal;color:#74936e}.hero p{margin:0;color:var(--muted);font-size:14px}.progress-card{width:260px;background:var(--white);padding:19px 20px;border:1px solid var(--line);border-radius:16px;flex-shrink:0}.progress-line{display:flex;justify-content:space-between;font-size:12px;font-weight:700}.progress-line small{color:var(--muted);font:11px 'DM Mono'}.bar{height:7px;background:#eeeee7;border-radius:9px;margin-top:15px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#8daf7d;border-radius:9px;transition:width .3s}.layout{display:grid;grid-template-columns:1.35fr .8fr;gap:20px}.panel{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:24px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.panel-head h2{font-size:16px;margin:0}.count{font:11px 'DM Mono';color:var(--muted)}.entry{display:flex;gap:8px;margin-bottom:18px}.entry input,.entry select{font:13px 'Noto Sans TC';border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;outline:none;color:var(--ink)}.entry input{flex:1;min-width:80px}.entry input:focus,.entry select:focus{border-color:#9ab68e}.entry select{width:100px}.add{border:0;border-radius:10px;padding:0 17px;background:var(--deep);color:white;font-weight:700;cursor:pointer}.add:hover{background:#244735}.tasks{display:grid;gap:9px}.task{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 13px;transition:.2s}.task.done{opacity:.55}.check{width:20px;height:20px;appearance:none;border:1.5px solid #bdc5b9;border-radius:50%;cursor:pointer;flex-shrink:0}.check:checked{background:#789b6c;border-color:#789b6c;position:relative}.check:checked:after{content:'✓';position:absolute;color:#fff;inset:-1px 0 0;text-align:center;font-size:13px}.task-title{font-size:13px;flex:1}.done .task-title{text-decoration:line-through}.tag{font-size:10px;padding:4px 8px;border-radius:20px;background:#f1eee5;color:#8a7259;white-space:nowrap}.tag.high{background:#fae7dd;color:#ae674b}.tag.low{background:#eaf0e5;color:#638058}.delete{border:0;background:none;color:#aaa;cursor:pointer;font-size:18px;line-height:1}.delete:hover{color:#bc6453}.empty{text-align:center;padding:32px 8px;color:#929990;font-size:13px}.right{display:grid;gap:20px;align-content:start}.timer{background:#e4eddc;border:1px solid #d5e1cb;border-radius:18px;padding:24px;position:relative;overflow:hidden}.timer:after{content:'✳';position:absolute;right:17px;top:12px;font-size:70px;color:#c8dbbb;opacity:.7}.timer h2{font-size:15px;margin:0 0 5px;position:relative;z-index:1}.timer p{font-size:11px;color:#688062;margin:0;position:relative;z-index:1}.clock{font:48px 'DM Mono',monospace;letter-spacing:-.06em;margin:24px 0 18px;color:#345640;position:relative;z-index:1}.timer-controls{display:flex;gap:8px;position:relative;z-index:1}.timer-controls button{border:0;border-radius:9px;padding:10px 15px;font:700 12px 'Noto Sans TC';cursor:pointer}.start{background:var(--deep);color:white}.reset{background:#ffffff9c;color:var(--deep)}.tip{border-radius:18px;background:#edeaf9;padding:22px 23px}.tip .eyebrow{color:#7770a4}.tip blockquote{margin:13px 0 0;font-size:14px;line-height:1.8;font-weight:600}.tip small{display:block;text-align:right;color:#8580a8;font-size:11px;margin-top:7px}.footer{text-align:center;color:#929990;font:10px 'DM Mono';padding-top:26px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#243c30;color:#fff;padding:10px 16px;border-radius:30px;font-size:12px;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.shell{padding:20px 16px 38px}.top{margin-bottom:32px}.hero{align-items:start;flex-direction:column}.progress-card{width:100%}.layout{grid-template-columns:1fr}.panel{padding:18px}.right{grid-template-columns:1fr 1fr}.entry{flex-wrap:wrap}.entry input{flex-basis:100%}.entry select{flex:1}.add{height:42px}.clock{font-size:39px}}@media(max-width:460px){.right{grid-template-columns:1fr}.date{font-size:10px}}
</style></head>
<body><main class="shell"><header class="top"><div class="brand"><span>✦</span>DAY QUEST / 日常探險</div><div class="date" id="today"></div></header>
<section class="hero"><div><div class="eyebrow">A SMALL STEP IS STILL AN ADVENTURE</div><h1>今天，去完成<br><em>一件小事。</em></h1><p>把想做的事放進清單，慢慢走也算前進。</p></div><div class="progress-card"><div class="progress-line"><span>今日探險進度</span><small id="progressText">0 / 0</small></div><div class="bar"><i id="progressBar"></i></div></div></section>
<section class="layout"><article class="panel"><div class="panel-head"><h2>🧭 今日任務</h2><span class="count" id="taskCount">0 TASKS</span></div><form class="entry" id="taskForm"><input id="taskInput" maxlength="60" placeholder="加一件想完成的小事…" aria-label="任務內容" required><select id="priority" aria-label="任務優先度"><option value="一般">一般</option><option value="重要">重要</option><option value="輕鬆">輕鬆</option></select><button class="add" type="submit">＋ 加入</button></form><div class="tasks" id="tasks"></div></article>
<aside class="right"><section class="timer"><h2>🌿 專注小憩</h2><p>給自己 25 分鐘，只做眼前這件事。</p><div class="clock" id="clock">25:00</div><div class="timer-controls"><button class="start" id="timerBtn">開始專注</button><button class="reset" id="resetBtn">重新計時</button></div></section><section class="tip"><div class="eyebrow">FIELD NOTE 01</div><blockquote id="quote">「不用一次走完全程，只要願意踏出第一步。」</blockquote><small>— 給正在努力的你</small></section></aside></section><footer class="footer">YOUR PACE, YOUR ADVENTURE · PROGRESS SAVED ON THIS DEVICE</footer></main><div class="toast" id="toast"></div>
<script>
const KEY='day-quest-tasks-v1';let tasks=JSON.parse(localStorage.getItem(KEY)||'[]');const $=s=>document.querySelector(s);const quotes=['「不用一次走完全程，只要願意踏出第一步。」','「休息不是偷懶，是讓旅程走得更遠。」','「今天的你，已經比昨天多走了一點。」','「把大事拆小，小事就能開始。」'];$('#today').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}).format(new Date());$('#quote').textContent=quotes[new Date().getDate()%quotes.length];
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));render()}function render(){const box=$('#tasks');box.innerHTML='';if(!tasks.length)box.innerHTML='<div class="empty">✨ 還沒有任務。先加入一件小事，開始今天的冒險吧！</div>';tasks.forEach((t,i)=>{const row=document.createElement('div');row.className='task'+(t.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.className='check';check.checked=t.done;check.setAttribute('aria-label','完成 '+t.text);check.onchange=()=>{tasks[i].done=check.checked;save();if(check.checked)toast('任務完成，做得好！✨')};const title=document.createElement('span');title.className='task-title';title.textContent=t.text;const tag=document.createElement('span');tag.className='tag '+(t.level==='重要'?'high':t.level==='輕鬆'?'low':'');tag.textContent=t.level;const del=document.createElement('button');del.className='delete';del.textContent='×';del.setAttribute('aria-label','刪除 '+t.text);del.onclick=()=>{tasks.splice(i,1);save()};row.append(check,title,tag,del);box.append(row)});const done=tasks.filter(t=>t.done).length;$('#taskCount').textContent=tasks.length+' TASK'+(tasks.length===1?'':'S');$('#progressText').textContent=done+' / '+tasks.length;$('#progressBar').style.width=(tasks.length?done/tasks.length*100:0)+'%'}
$('#taskForm').onsubmit=e=>{e.preventDefault();const text=$('#taskInput').value.trim();if(!text)return;tasks.unshift({text,level:$('#priority').value,done:false});$('#taskInput').value='';save();toast('新任務已加入地圖 🧭')};let seconds=1500,tick=null;function showClock(){$('#clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}$('#timerBtn').onclick=()=>{if(tick){clearInterval(tick);tick=null;$('#timerBtn').textContent='繼續專注'}else{tick=setInterval(()=>{seconds--;showClock();if(seconds<=0){clearInterval(tick);tick=null;$('#timerBtn').textContent='開始專注';toast('專注時段完成，起來伸展一下吧！🌱');seconds=1500;showClock()}},1000);$('#timerBtn').textContent='暫停'}};$('#resetBtn').onclick=()=>{clearInterval(tick);tick=null;seconds=1500;showClock();$('#timerBtn').textContent='開始專注'};let toastTimer;function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2100)}render();showClock();
</script></body></html>
